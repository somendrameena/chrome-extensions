<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Attendance Manager</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                width: 340px;
                background: #fff;
                color: #333;
            }

            .container {
                padding: 20px;
            }

            h2 {
                color: #1890ff;
                font-size: 22px;
                margin-bottom: 6px;
            }

            .subtitle {
                color: #777;
                font-size: 13px;
                margin-bottom: 24px;
            }

            .view {
                display: none;
            }

            .view.active {
                display: block;
            }

            .input-group {
                margin-bottom: 16px;
            }

            .input-group label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .input-group input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #d9d9d9;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: 0.2s;
            }

            .input-group input:focus {
                border-color: #1890ff;
            }

            .btn {
                width: 100%;
                padding: 11px;
                border: none;
                border-radius: 6px;
                color: white;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
            }

            .btn.login {
                background: #1890ff;
            }

            .btn.login:hover {
                background: #0f7ae5;
            }

            .btn.checkin {
                background: #1890ff;
            }

            .btn.checkin:hover {
                background: #0f7ae5;
            }

            .btn.checkout {
                background: #ff4d4f;
            }

            .btn.checkout:hover {
                background: #d9363e;
            }

            .btn.disabled {
                background: #d9d9d9;
                color: #888;
                cursor: not-allowed;
            }

            .btn.disabled:hover {
                background: #d9d9d9;
            }

            .subtitle-row {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                margin-bottom: 24px;
            }

            .subtitle-row .subtitle {
                margin-bottom: 0;
            }

            .logout-link {
                color: #ff4d4f;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                user-select: none;
                margin-left: 8px;
            }

            .logout-link:hover {
                color: #cf1322;
                text-decoration: underline;
            }
            
            .button-spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 2px solid rgba(255, 255, 255, 0.45);
                border-top-color: #fff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            .error-message {
                display: none;
                padding: 9px 10px;
                margin-bottom: 12px;
                border-radius: 6px;
                background: #fff1f0;
                color: #cf1322;
                font-size: 13px;
                line-height: 1.4;
            }

            .error-message.active {
                display: block;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>

        <div class="container">

            <!-- LOGIN VIEW -->
            <div id="loginView" class="view">

                <h2>Attendance Management</h2>
                <p class="subtitle">Login to continue</p>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password">
                </div>

                <div id="loginError" class="error-message" role="alert"></div>

                <button id="loginBtn" class="btn login">
                    Login
                </button>

            </div>


            <!-- HOME VIEW -->
            <div id="homeView" class="view">

                <h2>Attendance Management</h2>
                <div class="subtitle-row">
                    <p class="subtitle" id="welcomeText"></p>
                    <p></p>
                    <span id="logoutBtn" class="logout-link">
                        Logout
                    </span>
                </div>

                <div id="attendanceError" class="error-message" role="alert"></div>

                <button id="attendanceBtn" class="btn">
                    Check In
                </button>

            </div>

        </div>

        <script src="popup.js"></script>

    </body>
</html>
