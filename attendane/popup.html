<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Attendance Manager</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                width: 340px;
                background: #fff;
                color: #333;
            }

            .container {
                padding: 20px;
            }

            h2 {
                color: #1890ff;
                font-size: 22px;
                margin-bottom: 6px;
            }

            .subtitle {
                color: #777;
                font-size: 13px;
                margin-bottom: 24px;
            }

            .view {
                display: none;
            }

            .view.active {
                display: block;
            }

            .input-group {
                margin-bottom: 16px;
            }

            .input-group label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .input-group input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #d9d9d9;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: 0.2s;
            }

            .input-group input:focus {
                border-color: #1890ff;
            }

            .btn {
                width: 100%;
                padding: 11px;
                border: none;
                border-radius: 6px;
                background: #1890ff;
                color: white;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
            }

            .btn:hover {
                background: #0f7ae5;
            }

            .btn-secondary {
                margin-top: 10px;
                background: #fff;
                color: #1890ff;
                border: 1px solid #1890ff;
            }

            .btn-secondary:hover {
                background: #f5faff;
            }


            #status {
                margin-top: 12px;
                color: green;
            }

            .status-card {
                border: 1px solid #e8e8e8;
                border-radius: 8px;
                padding: 16px;
                margin-bottom: 20px;
            }

            .status-title {
                color: #888;
                font-size: 13px;
                margin-bottom: 6px;
            }

            .status-value {
                color: #1890ff;
                font-size: 20px;
                font-weight: bold;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <div id="status"></div>

            <!-- LOGIN VIEW -->
            <div id="loginView" class="view">

                <h2>Attendance Management</h2>
                <p class="subtitle">Login to continue</p>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password">
                </div>

                <button id="loginBtn" class="btn">
                    Login
                </button>

            </div>


            <!-- HOME VIEW -->
            <div id="homeView" class="view">

                <h2>Attendance Management</h2>
                <p class="subtitle" id="welcomeText"></p>

                <div class="status-card">
                    <div class="status-title">Status</div>
                    <div class="status-value" id="attendanceStatus">
                        Ready
                    </div>
                </div>

                <button id="attendanceBtn" class="btn">
                    Check In
                </button>

                <button id="logoutBtn" class="btn btn-secondary">
                    Logout
                </button>

            </div>

        </div>

        <script src="popup.js"></script>

    </body>
</html>
